<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wydarzenia — EventHub</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/gallery.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="/js/analytics-stub.js"></script>
    <script src="/js/filters.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">EventHub</a>
        <nav class="main-nav">
          <a href="/">Start</a>
          <a href="/events.html" aria-current="page">Wydarzenia</a>
          <a href="/gallery.html">Galeria</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      <h1>Wszystkie wydarzenia</h1>
      <div class="filters">
        <label>
          Miasto
          <input type="text" id="filter-city" placeholder="np. Kraków" />
        </label>
        <label>
          Gatunek
          <select id="filter-genre">
            <option value="">Wszystkie</option>
            <option value="Electronic">Electronic</option>
            <option value="Jazz">Jazz</option>
            <option value="Indie Rock">Indie Rock</option>
          </select>
        </label>
      </div>
      <div id="events-list" class="event-grid"></div>
    </main>

    <script>
      var allEvents = [];
      function responsiveEventImage(ev, isFirst) {
        var id = ev.heroImage.match(/gallery-(\d+)/)[1];
        var base = "/images/optimized/gallery-" + id;
        return (
          '<img src="' + base + '-480.webp" ' +
          'srcset="' + base + '-480.webp 480w, ' + base + '-960.webp 960w, ' + base + '-1600.webp 1600w" ' +
          'sizes="(max-width: 720px) 92vw, (max-width: 1100px) 45vw, 350px" ' +
          'alt="' + ev.title + '" width="1600" height="900" decoding="async" ' +
          (isFirst ? 'fetchpriority="high"' : 'loading="lazy"') + ' />'
        );
      }
      function renderEvents(list) {
        var root = document.getElementById("events-list");
        root.innerHTML = list
          .map(function (ev, index) {
            return (
              '<article class="event-card">' +
              responsiveEventImage(ev, index === 0) +
              "<h2>" +
              ev.title +
              "</h2>" +
              "<p>" +
              ev.description +
              "</p>" +
              "<p><strong>" +
              ev.pricePln +
              " PLN</strong></p>" +
              '<a class="btn btn-outline-primary" href="/event-detail.html?id=' +
              ev.id +
              '">Rezerwuj</a>' +
              "</article>"
            );
          })
          .join("");
      }
      fetch("/api/events")
        .then(function (r) {
          return r.json();
        })
        .then(function (data) {
          allEvents = data;
          renderEvents(data);
        });
      document.getElementById("filter-city").addEventListener("input", applyFilters);
      document.getElementById("filter-genre").addEventListener("change", applyFilters);
      function applyFilters() {
        var city = document.getElementById("filter-city").value.toLowerCase();
        var genre = document.getElementById("filter-genre").value;
        var filtered = allEvents.filter(function (ev) {
          var okCity = !city || ev.city.toLowerCase().indexOf(city) !== -1;
          var okGenre = !genre || ev.genre === genre;
          return okCity && okGenre;
        });
        renderEvents(filtered);
      }
    </script>
  </body>
</html>
